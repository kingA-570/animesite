<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My List - AnimeVerse</title>
<link rel="shortcut icon" href="img/TITLEBAR.PNG" type="image/x-icon"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
<link rel="stylesheet" href="css/style.css?v=2"/>
<link rel="stylesheet" href="css/themes.css"/>
<script src="js/theme.js"></script>
<style>
  body { margin:0; background:var(--c-bg); color:var(--c-text); font-family:'Nunito',system-ui,Arial,sans-serif; }
  * { box-sizing:border-box; }
  a { color:inherit; text-decoration:none; }
  .topbar { position:sticky; top:0; z-index:50; background:var(--c-header); border-bottom:1px solid var(--c-border); padding:10px 16px; display:flex; align-items:center; gap:14px; }
  .topbar .logo { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:1px; color:var(--c-text-bright); }
  .topbar .logo span { color:var(--c-accent); }
  .topbar nav { display:flex; gap:16px; font-weight:600; font-size:.92rem; flex:1; }
  .topbar nav a { color:var(--c-text); padding:4px 8px; border-radius:8px; }
  .topbar nav a:hover, .topbar nav a.active { color:var(--c-text-bright); background:var(--c-hover); }
  #userarea { font-size:.85rem; font-weight:700; }
  .wrap { max-width:1400px; margin:0 auto; padding:20px 16px; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:1px; color:var(--c-text-bright); margin:0 0 4px; }
  .tabs { display:flex; gap:8px; margin:16px 0 20px; }
  .tabs button { background:var(--c-surface); color:var(--c-text); border:1px solid var(--c-border); border-radius:10px; padding:8px 16px; cursor:pointer; font-weight:700; }
  .tabs button.active { background:var(--c-accent); border-color:var(--c-accent); color:var(--c-accent-text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .card { position:relative; background:var(--c-surface); border:1px solid var(--c-border); border-radius:12px; overflow:hidden; transition:transform .15s, border-color .15s; }
  .card:hover { transform:translateY(-4px); border-color:var(--c-accent); }
  .card .poster { position:relative; aspect-ratio:2/3; background:var(--c-hover) center/cover no-repeat; }
  .card .ep { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.65); color:#fff; font-size:.68rem; font-weight:700; padding:3px 7px; border-radius:6px; }
  .card .rm { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.65); color:#ff6b6b; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; cursor:pointer; font-size:.7rem; border:0; }
  .card .info { padding:10px; }
  .card .info .t { font-size:.85rem; font-weight:700; color:var(--c-text-bright); line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  /* auth card */
  .authbox { max-width:480px; margin:40px auto; background:var(--c-surface); border:1px solid var(--c-border); border-radius:16px; padding:30px; }
  .authbox h2 { margin:0 0 6px; color:var(--c-text-bright); font-size:1.3rem; }
  .authbox p { margin:0 0 18px; font-size:.85rem; opacity:.75; }
  .authbox input { width:100%; box-sizing:border-box; margin:6px 0 12px; padding:11px 12px; background:var(--c-bg); color:var(--c-text); border:1px solid var(--c-border); border-radius:10px; outline:none; font-size:.92rem; }
  .authbox input:focus { border-color:var(--c-accent); }
  .authbox button { width:100%; padding:11px; border:0; border-radius:10px; background:var(--c-accent); color:var(--c-accent-text); font-weight:700; font-size:.95rem; cursor:pointer; }
  .authbox .switch { text-align:center; margin-top:14px; font-size:.85rem; }
  .authbox .switch a { color:var(--c-accent-soft); cursor:pointer; font-weight:700; }
  .empty { text-align:center; padding:50px 0; color:var(--c-text); opacity:.7; }
  .spin { text-align:center; padding:60px 0; color:var(--c-text); }
  .err { color:#ff6b6b; font-size:.85rem; margin-bottom:12px; min-height:18px; }
  @media(max-width:560px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(110px,1fr));} }
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="/">Anime<span>Verse</span></a>
  <nav>
    <a href="/home">Home</a>
    <a href="/catalog">Catalog</a>
    <a href="/schedule">Schedule</a>
    <a href="/profile" class="active">My List</a>
  </nav>
  <div id="userarea"></div>
</div>
<div class="wrap" id="main">
  <div class="spin">Loading...</div>
</div>
<script>
const main=document.getElementById('main');
const userarea=document.getElementById('userarea');
let user=null;
let mode='watchlist';

async function api(url,opts){ const r=await fetch(url,opts); const d=await r.json().catch(()=>({})); return {r,d}; }

function cardHTML(m,isHistory){
  const img=m.image||'';
  return `<div class="card">
    <a href="/watch.html?anilistId=${m.anilistId}" class="poster" style="background-image:url('${img}')">
      ${isHistory&&m.episode?`<span class="ep">Ep ${m.episode}</span>`:''}
    </a>
    <button class="rm" title="Remove" data-id="${m.anilistId}" data-hist="${isHistory?1:0}"><i class="fas fa-times"></i></button>
    <div class="info"><a href="/watch.html?anilistId=${m.anilistId}"><div class="t">${m.title||('ID '+m.anilistId)}</div></a></div>
  </div>`;
}

async function load(){
  if(!user){
    main.innerHTML=`<div class="authbox">
      <h2>Sign in to sync your list</h2>
      <p>Save bookmarks and watch progress across devices with a free account.</p>
      <div class="err" id="errmsg"></div>
      <input id="auser" placeholder="Username" autocomplete="username">
      <input id="apass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <button onclick="doAuth(false)">Sign in</button>
      <div class="switch">New here? <a onclick="doAuth(true)">Create account</a></div>
    </div>`;
    return;
  }
  userarea.textContent='Hi, '+user.username+' &middot; <a href="#" onclick="logout();return false;" style="color:var(--c-accent-soft)">Logout</a>';
  main.innerHTML=`<h1>Your ${mode==='watchlist'?'Watchlist':'History'}</h1>
    <div class="tabs">
      <button id="t-watchlist" class="${mode==='watchlist'?'active':''}" onclick="setMode('watchlist')">Watchlist</button>
      <button id="t-history" class="${mode==='history'?'active':''}" onclick="setMode('history')">History</button>
    </div>
    <div class="grid" id="grid"><div class="spin">Loading...</div></div>`;
  const {d}=await api('/api/library/'+mode);
  const gridEl=document.getElementById('grid');
  gridEl.innerHTML='';
  const items=d.items||[];
  if(!items.length){ gridEl.innerHTML='<div class="empty">Your '+mode+' is empty. Start watching!</div>'; return; }
  const frag=document.createDocumentFragment();
  items.forEach(m=>{ const t=document.createElement('div'); t.innerHTML=cardHTML(m,mode==='history'); const c=t.firstElementChild; c.querySelector('.rm').onclick=()=>remove(m.anilistId); frag.appendChild(c); });
  gridEl.appendChild(frag);
}
function setMode(m){ mode=m; if(user) load(); }
async function remove(id){
  await fetch('/api/library/'+mode+'?anilistId='+id,{method:'DELETE'});
  load();
}
async function doAuth(reg){
  const err=document.getElementById('errmsg');
  const username=document.getElementById('auser').value.trim();
  const password=document.getElementById('apass').value;
  const {r,d}=await api('/api/auth/'+(reg?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  if(r.ok){ user=d.user; load(); }
  else err.textContent=d.error||'Something went wrong.';
}
async function logout(){ await fetch('/api/auth/logout',{method:'POST'}); user=null; location.reload(); }
(async()=>{
  const {d}=await api('/api/auth/me');
  user=d.user||null;
  load();
})();
</script>
</body>
</html>
