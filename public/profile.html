<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My List - AnimeVerse</title>
<link rel="shortcut icon" href="img/TITLEBAR.PNG" type="image/x-icon"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>
<link rel="stylesheet" href="css/style.css?v=20260830"/>
<link rel="stylesheet" href="css/themes.css?v=20260830"/>
<script src="js/theme.js"></script>
<style>
  body { margin:0; background:var(--c-bg); color:var(--c-text); font-family:'Nunito',system-ui,Arial,sans-serif; }
  * { box-sizing:border-box; }
  a { color:inherit; text-decoration:none; }
  .topbar { position:sticky; top:0; z-index:50; background:var(--c-header); border-bottom:1px solid var(--c-border); padding:10px 16px; display:flex; align-items:center; gap:14px; }
  .topbar .logo { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:1px; color:var(--c-text-bright); }
  .topbar .logo span { color:var(--c-accent); }
  .topbar nav { display:flex; gap:16px; font-weight:600; font-size:.92rem; flex:1; }
  .topbar nav a { color:var(--c-text); padding:4px 8px; border-radius:8px; }
  .topbar nav a:hover, .topbar nav a.active { color:var(--c-text-bright); background:var(--c-hover); }
  .wrap { max-width:1400px; margin:0 auto; padding:20px 16px; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:1px; color:var(--c-text-bright); margin:0 0 4px; }
  .subtitle { color:var(--c-text-2); font-size:.85rem; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin:16px 0 20px; }
  .tabs button { background:var(--c-surface); color:var(--c-text); border:1px solid var(--c-border); border-radius:10px; padding:8px 16px; cursor:pointer; font-weight:700; }
  .tabs button.active { background:var(--c-accent); border-color:var(--c-accent); color:var(--c-accent-text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .card { position:relative; background:var(--c-surface); border:1px solid var(--c-border); border-radius:12px; overflow:hidden; transition:transform .15s, border-color .15s; }
  .card:hover { transform:translateY(-4px); border-color:var(--c-accent); }
  .card .poster { position:relative; aspect-ratio:2/3; background:var(--c-hover) center/cover no-repeat; display:block; }
  .card .ep { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.65); color:#fff; font-size:.68rem; font-weight:700; padding:3px 7px; border-radius:6px; }
  .card .status-badge { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.65); color:var(--c-accent-soft); font-size:.62rem; font-weight:700; padding:3px 7px; border-radius:6px; text-transform:uppercase; }
  .card .rm { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,.65); color:#ff6b6b; width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%; cursor:pointer; font-size:.7rem; border:0; opacity:0; transition:opacity .15s; }
  .card:hover .rm { opacity:1; }
  .card .info { padding:10px; }
  .card .info .t { font-size:.85rem; font-weight:700; color:var(--c-text-bright); line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .empty { text-align:center; padding:50px 0; color:var(--c-text); opacity:.7; }
  .empty i { font-size:2.5rem; margin-bottom:12px; display:block; color:var(--c-text-3); }
  @media(max-width:560px){ .grid{ grid-template-columns:repeat(auto-fill,minmax(110px,1fr));} }
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="/home">Anime<span>Verse</span></a>
  <nav>
    <a href="/home">Home</a>
    <a href="/catalog">Catalog</a>
    <a href="/schedule">Schedule</a>
    <a href="/profile" class="active">My List</a>
  </nav>
</div>
<div class="wrap" id="main">
  <div class="spin">Loading...</div>
</div>
<script>
const main = document.getElementById('main');
let mode = 'watchlist';

const STATUS_LABELS = { watching: 'Watching', planning: 'Planning', completed: 'Completed', on_hold: 'On Hold', dropped: 'Dropped' };

function read(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e) { return {}; }
}

function cardHTML(item, status) {
  const img = item.poster || item.image || '';
  return `<div class="card">
    <a href="/watch.html?anilistId=${item.id}" class="poster" style="background-image:url('${img.replace(/'/g, "\\'")}')">
    </a>
    ${status ? `<span class="status-badge">${STATUS_LABELS[status] || status}</span>` : ''}
    <button class="rm" title="Remove" data-id="${item.id}"><i class="fas fa-times"></i></button>
    <div class="info"><a href="/watch.html?anilistId=${item.id}"><div class="t">${item.title || ('ID ' + item.id)}</div></a></div>
  </div>`;
}

function load() {
  const list = read('animekai:list');
  const cont = read('animekai:continue');
  const playing = read('user.playing');

  if (mode === 'watchlist') {
    const items = Object.keys(list).map(id => ({ id, ...list[id] }))
      .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));

    if (!items.length) {
      main.innerHTML = `<h1>Your Watchlist</h1>
        <p class="subtitle">Anime you've bookmarked will appear here.</p>
        <div class="empty"><i class="fas fa-bookmark"></i>Your watchlist is empty.<br>Browse anime and add some!</div>`;
      return;
    }

    main.innerHTML = `<h1>Your Watchlist</h1>
      <p class="subtitle">${items.length} title${items.length !== 1 ? 's' : ''}</p>
      <div class="tabs">
        <button class="active" onclick="setMode('watchlist')">Watchlist</button>
        <button onclick="setMode('continue')">Continue Watching</button>
      </div>
      <div class="grid" id="grid"></div>`;

    const grid = document.getElementById('grid');
    items.forEach(item => {
      const div = document.createElement('div');
      div.innerHTML = cardHTML(item, item.status);
      const card = div.firstElementChild;
      card.querySelector('.rm').onclick = () => {
        delete list[item.id];
        localStorage.setItem('animekai:list', JSON.stringify(list));
        load();
      };
      grid.appendChild(card);
    });
  } else {
    // Continue watching
    const items = Object.keys(cont).map(key => {
      const c = cont[key] || {};
      const p = playing[key] || [c.epNum || c.ep || 1, 0, 0];
      const ep = Array.isArray(p) ? p[0] : (c.epNum || c.ep || 1);
      return { key, title: c.title || key, poster: c.poster || '', ep, anilistId: c.anilistId || '', slug: c.slug || '' };
    }).sort((a, b) => ((cont[b.key] || {}).ts || 0) - ((cont[a.key] || {}).ts || 0));

    if (!items.length) {
      main.innerHTML = `<h1>Continue Watching</h1>
        <p class="subtitle">Your watch progress will show up here.</p>
        <div class="tabs">
          <button onclick="setMode('watchlist')">Watchlist</button>
          <button class="active" onclick="setMode('continue')">Continue Watching</button>
        </div>
        <div class="empty"><i class="fas fa-play-circle"></i>Nothing here yet.<br>Start watching an anime!</div>`;
      return;
    }

    main.innerHTML = `<h1>Continue Watching</h1>
      <p class="subtitle">${items.length} anime</p>
      <div class="tabs">
        <button onclick="setMode('watchlist')">Watchlist</button>
        <button class="active" onclick="setMode('continue')">Continue Watching</button>
      </div>
      <div class="grid" id="grid"></div>`;

    const grid = document.getElementById('grid');
    items.forEach(item => {
      const q = new URLSearchParams();
      if (item.slug) q.set('slug', item.slug);
      if (item.anilistId) q.set('anilistId', item.anilistId);
      q.set('ep', item.ep);

      const div = document.createElement('div');
      div.innerHTML = `<div class="card">
        <a href="/watch.html?${q.toString()}" class="poster" style="background-image:url('${(item.poster || '').replace(/'/g, "\\'")}')">
          <span class="ep">Ep ${item.ep}</span>
        </a>
        <button class="rm" title="Remove" data-key="${item.key}"><i class="fas fa-times"></i></button>
        <div class="info"><a href="/watch.html?${q.toString()}"><div class="t">${item.title}</div></a></div>
      </div>`;
      const card = div.firstElementChild;
      card.querySelector('.rm').onclick = () => {
        delete cont[item.key];
        delete playing[item.key];
        localStorage.setItem('animekai:continue', JSON.stringify(cont));
        localStorage.setItem('user.playing', JSON.stringify(playing));
        load();
      };
      grid.appendChild(card);
    });
  }
}

function setMode(m) { mode = m; load(); }

load();
</script>
</body>
</html>
