services:
  - type: web
    name: animesite
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    healthCheckTimeout: 300
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: PYTHON
        value: python3
      - key: NODE_OPTIONS
        value: "--max-old-space-size=192 --max-semi-space-size=16"
      # Uncomment to require a token before anyone can use the site:
      # - key: ACCESS_TOKEN
      #   generateValue: true
