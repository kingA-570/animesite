<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKai - Video Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        #player-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Poster backdrop (shown until playback starts) */
        #poster {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #0c0c14 center/cover no-repeat;
            opacity: 1;
            transition: opacity 0.6s ease;
        }
        #poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.5));
        }
        #poster.hide { opacity: 0; pointer-events: none; }

        video, #hls-video {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Big center play button (Vidstream-style) */
        #big-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: rgba(229, 30, 58, 0.92);
            border: 3px solid rgba(255,255,255,0.85);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(0,0,0,0.55);
            transition: transform 0.18s ease, background 0.18s ease, opacity 0.25s ease;
        }
        #big-play:hover { transform: translate(-50%, -50%) scale(1.07); background: #e51e3a; }
        #big-play svg { width: 36px; height: 36px; margin-left: 4px; }
        #big-play.hide { opacity: 0; pointer-events: none; }

        /* Top controls */
        #controls-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 18px;
            background: linear-gradient(rgba(0,0,0,0.55), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        #controls-top.active { opacity: 1; }
        #episode-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Loading */
        #loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 7;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }
        #loading-overlay.show { display: flex; }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #e51e3a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { color: #ccc; font-size: 14px; letter-spacing: 0.3px; }

        /* Error */
        #error-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 7;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            padding: 24px;
        }
        #error-overlay.show { display: flex; }
        #error-icon { font-size: 46px; opacity: 0.6; }
        #error-text { color: #ddd; font-size: 16px; max-width: 420px; line-height: 1.5; }

        /* Skip intro/outro */
        #skip-controls {
            position: absolute;
            right: 18px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 5;
            pointer-events: none;
        }
        .skip-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: rgba(20, 22, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transform: translateX(12px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .skip-btn.show { opacity: 1; transform: translateX(0); }
        .skip-btn:hover { background: rgba(229,30,58,0.9); border-color: #e51e3a; }
        .skip-btn svg { flex-shrink: 0; }

        /* ===== Bottom controls (Vidstream-style) ===== */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 18px 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7) 72%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #controls.active { opacity: 1; }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Custom seek bar */
        #seek-bar {
            position: relative;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: rgba(255,255,255,0.22);
            cursor: pointer;
            margin-bottom: 12px;
            overflow: visible;
        }
        .seek-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 3px;
            pointer-events: none;
        }
        .seek-fill.buffer { background: rgba(255,255,255,0.35); }
        .seek-fill.progress { background: #e51e3a; }
        .seek-thumb {
            position: absolute;
            top: 50%;
            left: 0;
            width: 13px;
            height: 13px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0,0,0,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        #seek-bar:hover .seek-thumb,
        #seek-bar.dragging .seek-thumb { opacity: 1; }

        #time-display {
            font-size: 13px;
            color: #e8e8e8;
            min-width: 108px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .ctrl-btn svg { width: 20px; height: 20px; }
        #prev-ep-btn, #next-ep-btn { color: #b5a8ff; }
        #prev-ep-btn:hover, #next-ep-btn:hover { background: rgba(181,168,255,0.2); color: #cfc9ff; }
        #prev-ep-btn.hide, #next-ep-btn.hide { display: none; }

        /* Subtitle cue styling (injected dynamically) */
        #cue-style { display: none; }

        #volume-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #volume-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 3px;
            background: rgba(255,255,255,0.3);
            outline: none;
            cursor: pointer;
        }
        #volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
        #volume-bar::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }

        /* Settings gear + menu */
        #settings-btn { font-size: 18px; }
        #settings-menu {
            position: absolute;
            right: 12px;
            bottom: 74px;
            z-index: 12;
            width: 240px;
            background: rgba(14, 14, 20, 0.92);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            padding: 8px;
            display: none;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        #settings-menu.open { display: block; }
        .menu-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 6px;
        }
        .menu-back {
            background: none;
            border: none;
            color: #bbb;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            visibility: hidden;
        }
        .menu-back.visible { visibility: visible; }
        .menu-back:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .menu-title {
            font-size: 13px;
            font-weight: 600;
            color: #e8e8e8;
            letter-spacing: 0.3px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            padding: 10px 12px;
            background: none;
            border: none;
            border-radius: 8px;
            color: #d5d8e6;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
        }
        .menu-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .menu-item.active { color: #b5a8ff; font-weight: 700; }
        .menu-item.active .menu-value { color: #b5a8ff; }
        .menu-item.active::before {
            content: '✓';
            font-size: 12px;
            margin-right: -4px;
        }
        .menu-value { color: #8b93b5; font-size: 12.5px; font-weight: 600; }
        .menu-value .swatch {
            display: inline-block; width: 12px; height: 12px; border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.3); vertical-align: -1px; margin-right: 6px;
        }
        .menu-item .chevron { color: #8b93b5; font-size: 11px; }
        .menu-item.hide { display: none; }
        #cc-btn.on { color: #b5a8ff; }

        /* Seek indicator + center flash (gestures) */
        .seek-indicator {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.55);
            border-radius: 50%;
            width: 76px;
            height: 76px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 6;
        }
        .seek-indicator.show { opacity: 1; }
        .seek-indicator svg { width: 26px; height: 26px; }
        .seek-indicator .seek-time { font-size: 11px; color: #fff; font-variant-numeric: tabular-nums; }
        #center-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
        }
        #center-flash.show { animation: flashPop 0.5s ease; }
        #center-flash svg { width: 34px; height: 34px; color: #fff; }
        @keyframes flashPop {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
        }

        @media (max-width: 768px) {
            #time-display { font-size: 10px; min-width: 0; flex-shrink: 1; text-align: right; }
            .ctrl-btn { width: 34px; height: 34px; }
            .ctrl-btn svg { width: 17px; height: 17px; }
            #volume-container { display: none; }
            #big-play { width: 72px; height: 72px; }
            #big-play svg { width: 28px; height: 28px; }
            #settings-menu { width: 200px; right: 8px; bottom: 64px; max-height: calc(100dvh - 96px); overflow-y: auto; }
            #controls { padding: 14px 10px 10px; }
            .controls-row { gap: 2px; }
            #seek-bar { margin-bottom: 10px; }
            #controls-top { padding: 10px 12px; }
            #episode-title { font-size: 13px; }
            #skip-controls { right: 10px; bottom: 88px; }
        }
        @media (max-width: 400px) {
            .ctrl-btn { width: 30px; height: 30px; }
            .ctrl-btn svg { width: 15px; height: 15px; }
            #settings-menu { width: calc(100vw - 16px); }
        }
    </style>
</head>
<body>
    <div id="player-container">
        <!-- Poster backdrop -->
        <div id="poster"></div>

        <!-- Top controls -->
        <div id="controls-top">
            <span id="episode-title">Now Playing</span>
        </div>

        <!-- Loading -->
        <div id="loading-overlay" class="show">
            <div class="spinner"></div>
            <div id="loading-text">Loading video...</div>
        </div>

        <!-- Error -->
        <div id="error-overlay">
            <div id="error-icon">⚠️</div>
            <div id="error-text">Failed to load video.</div>
        </div>

        <!-- Skip intro / outro -->
        <div id="skip-controls">
            <button id="skip-intro-btn" class="skip-btn" title="Skip Intro">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                Skip Intro
            </button>
            <button id="skip-outro-btn" class="skip-btn" title="Skip Outro">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                Skip Outro
            </button>
        </div>

        <!-- Big center play button -->
        <button id="big-play" title="Play">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </button>

        <!-- Video element -->
        <video id="hls-video" playsinline controlslist="nodownload" preload="metadata"></video>

        <!-- Center flash + seek indicator (gestures) -->
        <div id="center-flash">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
            </svg>
        </div>
        <div id="seek-indicator" class="seek-indicator"></div>

        <!-- Settings menu -->
        <div id="settings-menu">
            <div class="menu-header">
                <button id="menu-back" class="menu-back" title="Back">←</button>
                <span id="menu-title" class="menu-title">Settings</span>
            </div>
            <div id="menu-items" class="menu-items"></div>
        </div>

        <!-- Bottom controls -->
        <div id="controls">
            <div id="seek-bar">
                <div id="seek-buffer" class="seek-fill buffer"></div>
                <div id="seek-progress" class="seek-fill progress"></div>
                <div id="seek-thumb" class="seek-thumb"></div>
            </div>
            <div class="controls-row">
                <button id="prev-ep-btn" class="ctrl-btn" title="Previous Episode">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>

                <button id="play-btn" class="ctrl-btn" title="Play/Pause">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                </button>

                <button id="rewind-btn" class="ctrl-btn" title="Rewind 10s">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                </button>

                <button id="forward-btn" class="ctrl-btn" title="Forward 10s">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                </button>

                <button id="next-ep-btn" class="ctrl-btn" title="Next Episode">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h2v12H4zm3.5 6 8.5-6v12z"/></svg>
                </button>

                <div id="volume-container">
                    <button id="mute-btn" class="ctrl-btn" title="Mute">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        </svg>
                    </button>
                    <input type="range" id="volume-bar" value="100" min="0" max="100">
                </div>

                <span id="time-display">0:00 / 0:00</span>

                <div style="flex:1"></div>

                <button id="cc-btn" class="ctrl-btn" title="Subtitles">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="6" width="20" height="12" rx="3"/>
                        <path d="M8 10.2a2.2 2.2 0 1 0 0 3.6M16 10.2a2.2 2.2 0 1 0 0 3.6"/>
                    </svg>
                </button>

                <button id="settings-btn" class="ctrl-btn" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>

                <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Get URL from query string ---
        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name) || '';
        }

        const encodedUrl = getQueryParam('url') || getQueryParam('v');
        let videoUrl = '';
        try {
            videoUrl = decodeURIComponent(encodedUrl);
        } catch (e) {
            videoUrl = encodedUrl;
        }

        const title = decodeURIComponent(getQueryParam('title')) || 'Now Playing';
        document.getElementById('episode-title').textContent = title;

        const posterUrl = decodeURIComponent(getQueryParam('poster')) || '';
        if (posterUrl) {
            const poster = document.getElementById('poster');
            poster.style.backgroundImage = `url("${posterUrl}")`;
        }

        // --- Subtitles (?subs=JSON array of {label, lang, file, default}) ---
        const subsMeta = (() => {
            try { return JSON.parse(getQueryParam('subs') || '[]'); } catch (e) { return []; }
        })();
        let subtitleIndex = -1;
        function currentSubtitleLabel() {
            if (subtitleIndex < 0 || !subsMeta[subtitleIndex]) return 'Off';
            return subsMeta[subtitleIndex].label || subsMeta[subtitleIndex].lang || 'Subtitle';
        }

        // --- DOM refs ---
        const video = document.getElementById('hls-video');
        const playerContainer = document.getElementById('player-container');
        const playBtn = document.getElementById('play-btn');
        const bigPlay = document.getElementById('big-play');
        const seekBar = document.getElementById('seek-bar');
        const seekProgress = document.getElementById('seek-progress');
        const seekBuffer = document.getElementById('seek-buffer');
        const seekThumb = document.getElementById('seek-thumb');
        const timeDisplay = document.getElementById('time-display');
        const volumeBar = document.getElementById('volume-bar');
        const muteBtn = document.getElementById('mute-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const errorOverlay = document.getElementById('error-overlay');
        const errorText = document.getElementById('error-text');
        const settingsBtn = document.getElementById('settings-btn');
        const ccBtn = document.getElementById('cc-btn');
        const settingsMenu = document.getElementById('settings-menu');
        const menuBack = document.getElementById('menu-back');
        const menuTitle = document.getElementById('menu-title');
        const menuItems = document.getElementById('menu-items');
        const rewindBtn = document.getElementById('rewind-btn');
        const forwardBtn = document.getElementById('forward-btn');
        const prevEpBtn = document.getElementById('prev-ep-btn');
        const nextEpBtn = document.getElementById('next-ep-btn');
        const controls = document.getElementById('controls');
        const controlsTop = document.getElementById('controls-top');
        let controlsTimeout = null;
        let settingsOpen = false;
        let menuSection = 'main';

        function formatTime(s) {
            if (!isFinite(s) || s < 0) s = 0;
            s = Math.floor(s);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return h > 0
                ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
                : `${m}:${String(sec).padStart(2, '0')}`;
        }

        // --- Show/hide controls ---
        function showControls(keep) {
            controls.classList.add('active');
            controlsTop.classList.add('active');
            clearTimeout(controlsTimeout);
            if (!keep) {
                controlsTimeout = setTimeout(() => {
                    if (!settingsOpen) hideControls();
                }, 2500);
            }
        }
        function hideControls() {
            controls.classList.remove('active');
            controlsTop.classList.remove('active');
            clearTimeout(controlsTimeout);
        }

        // --- Seek rendering ---
        function renderSeek() {
            const d = video.duration || 0;
            const t = video.currentTime || 0;
            const pct = d ? (t / d) * 100 : 0;
            seekProgress.style.width = pct + '%';
            seekThumb.style.left = pct + '%';
            timeDisplay.textContent = `${formatTime(t)} / ${formatTime(d)}`;
            try {
                const b = video.buffered;
                let maxEnd = 0;
                for (let i = 0; i < b.length; i++) if (b.end(i) > maxEnd) maxEnd = b.end(i);
                seekBuffer.style.width = (d ? (maxEnd / d) * 100 : 0) + '%';
            } catch (e) {
                seekBuffer.style.width = '0%';
            }
        }

        // Seek bar interactions
        let seekDrag = false;
        function seekToClientX(clientX) {
            const rect = seekBar.getBoundingClientRect();
            const ratio = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
            const t = ratio * (video.duration || 0);
            video.currentTime = t;
            renderSeek();
        }
        seekBar.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            seekDrag = true;
            seekBar.classList.add('dragging');
            try { seekBar.setPointerCapture(e.pointerId); } catch (err) {}
            seekToClientX(e.clientX);
        });
        seekBar.addEventListener('pointermove', (e) => {
            if (seekDrag) seekToClientX(e.clientX);
        });
        seekBar.addEventListener('pointerup', (e) => {
            seekDrag = false;
            seekBar.classList.remove('dragging');
        });

        // --- Interactive gestures (miruro-style): tap-to-seek + hold & drag to scrub ---
        const centerFlash = document.getElementById('center-flash');
        const seekIndicator = document.getElementById('seek-indicator');

        function flashCenter(iconInner) {
            centerFlash.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${iconInner}</svg>`;
            centerFlash.classList.remove('show');
            void centerFlash.offsetWidth;
            centerFlash.classList.add('show');
        }

        function showSeekIndicator(x, y, dir, time) {
            seekIndicator.style.left = x + 'px';
            seekIndicator.style.top = (y !== undefined ? y : '50%') + (typeof y === 'number' ? 'px' : '');
            const arrow = dir >= 0
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';
            seekIndicator.innerHTML = arrow + `<span class="seek-time">${formatTime(time)}</span>`;
            seekIndicator.classList.add('show');
        }
        function hideSeekIndicator() {
            seekIndicator.classList.remove('show');
        }

        let gesture = null;
        let gestureHoldTimer = null;
        let lastTapTime = 0;
        let lastTapX = 0;
        let lastTapY = 0;
        let pendingTapTimer = null;

        function isInteractiveTarget(target) {
            return target === video || !!target.closest('.seek-indicator, #center-flash');
        }

        playerContainer.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#controls, #controls-top, #big-play, #settings-menu')) return;
            if (!isInteractiveTarget(e.target)) return;
            e.preventDefault();

            const rect = playerContainer.getBoundingClientRect();
            cancelGesture();
            gesture = {
                startClientX: e.clientX,
                startClientY: e.clientY,
                startTime: performance.now(),
                mode: null,
                baseTime: video.currentTime || 0,
                width: rect.width,
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
            };
            try { playerContainer.setPointerCapture(e.pointerId); } catch (err) {}
            gestureHoldTimer = setTimeout(() => {
                if (gesture) gesture.mode = 'drag';
            }, 250);
        });

        playerContainer.addEventListener('pointermove', (e) => {
            if (!gesture) return;
            const dx = e.clientX - gesture.startClientX;
            const dy = e.clientY - gesture.startClientY;
            const dist = Math.hypot(dx, dy);

            if (!gesture.mode) {
                if (dist > 18) {
                    clearTimeout(gestureHoldTimer);
                    gesture.mode = 'drag';
                } else {
                    return;
                }
            }

            if (gesture.mode === 'drag') {
                e.preventDefault();
                const target = gesture.baseTime + (dx / gesture.width) * (video.duration || 0);
                const clamped = Math.min(Math.max(0, target), video.duration || 0);
                video.currentTime = clamped;
                renderSeek();
                const rect = playerContainer.getBoundingClientRect();
                showSeekIndicator(e.clientX - rect.left, '50%', dx, clamped);
            }
        });

        playerContainer.addEventListener('pointerup', (e) => {
            clearTimeout(gestureHoldTimer);
            if (!gesture) return;
            const g = gesture;
            const rect = playerContainer.getBoundingClientRect();
            const dx = e.clientX - g.startClientX;
            const dy = e.clientY - g.startClientY;
            const dist = Math.hypot(dx, dy);
            const elapsed = performance.now() - g.startTime;
            cancelGesture();

            if (g.mode === 'drag') {
                hideSeekIndicator();
                showControls(false);
                return;
            }

            if (elapsed < 300 && dist < 12) {
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const now = performance.now();

                // Double-tap / double-click detection: two quick taps within
                // 320ms and 40px of each other trigger a forward/backward seek
                // (right half = forward, left half = backward). The pending
                // single-tap action is cancelled so only one seek happens.
                if (lastTapTime && now - lastTapTime < 320 && Math.hypot(x - lastTapX, y - lastTapY) < 40) {
                    clearTimeout(pendingTapTimer);
                    pendingTapTimer = null;
                    lastTapTime = 0;
                    const dir = x < rect.width / 2 ? -1 : 1;
                    const t = Math.min(Math.max(0, video.currentTime + dir * step), video.duration || 0);
                    video.currentTime = t;
                    showSeekIndicator(x, y, dir, t);
                    setTimeout(hideSeekIndicator, 700);
                    flashCenter(dir > 0
                        ? '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'
                        : '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>');
                    showControls(false);
                    return;
                }

                // First tap: remember it and defer the single-tap action briefly
                // so a second quick tap can become a double-tap instead.
                lastTapTime = now;
                lastTapX = x;
                lastTapY = y;
                clearTimeout(pendingTapTimer);
                pendingTapTimer = setTimeout(() => {
                    pendingTapTimer = null;
                    lastTapTime = 0;
                    if (x < rect.width / 3) {
                        const t = Math.max(0, video.currentTime - step);
                        video.currentTime = t;
                        showSeekIndicator(x, y, -1, t);
                        setTimeout(hideSeekIndicator, 700);
                    } else if (x > (rect.width * 2) / 3) {
                        const t = Math.min(video.duration || 0, video.currentTime + step);
                        video.currentTime = t;
                        showSeekIndicator(x, y, 1, t);
                        setTimeout(hideSeekIndicator, 700);
                    } else {
                        if (video.paused) video.play(); else video.pause();
                        flashCenter(video.paused
                            ? '<polygon points="5,3 19,12 5,21"/>'
                            : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>');
                    }
                    showControls(false);
                }, 280);
            }
        });

        playerContainer.addEventListener('pointercancel', cancelGesture);
        function cancelGesture() {
            clearTimeout(gestureHoldTimer);
            clearTimeout(pendingTapTimer);
            pendingTapTimer = null;
            gesture = null;
        }

        playerContainer.addEventListener('click', (e) => {
            if (isInteractiveTarget(e.target)) e.preventDefault();
        });

        // Big play button
        bigPlay.addEventListener('click', (e) => {
            e.stopPropagation();
            video.play().catch(() => {});
        });

        playerContainer.addEventListener('mousemove', () => showControls(false));
        playerContainer.addEventListener('touchstart', () => showControls(false));

        // --- Load video ---
        function loadVideo(url) {
            if (!url) {
                loadingOverlay.classList.remove('show');
                errorOverlay.classList.add('show');
                errorText.textContent = 'No video URL provided.';
                return;
            }

            loadingOverlay.classList.add('show');

            if (url.includes('.m3u8') || url.includes('master.m3u8') || url.includes('playlist.m3u8')) {
                const tryNative = () => {
                    if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                        video.addEventListener('loadedmetadata', () => {
                            loadingOverlay.classList.remove('show');
                            tryPlay();
                        });
                    } else {
                        loadingOverlay.classList.remove('show');
                        errorOverlay.classList.add('show');
                        errorText.textContent = 'Your browser does not support HLS streaming.';
                    }
                };
                const loadHls = () => {
                    if (window.Hls && Hls.isSupported()) {
                        const hls = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true,
                            backbufferLength: 30
                        });
                        hlsInstance = hls;
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            loadingOverlay.classList.remove('show');
                            buildQualityList();
                            tryPlay();
                        });
                        hls.on(Hls.Events.LEVEL_SWITCHED, () => {
                            if (menuSection === 'quality') renderMenu('quality');
                        });
                        hls.on(Hls.Events.ERROR, (event, data) => {
                            if (data.fatal) {
                                loadingOverlay.classList.remove('show');
                                errorOverlay.classList.add('show');
                                errorText.textContent = 'Failed to load this HLS stream. The video may be unavailable.';
                            }
                        });
                        window._hls = hls;
                    } else {
                        tryNative();
                    }
                };

                if (typeof window.Hls !== 'undefined') {
                    loadHls();
                } else {
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
                    script.onload = loadHls;
                    script.onerror = tryNative;
                    document.head.appendChild(script);
                }
            } else {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    loadingOverlay.classList.remove('show');
                    tryPlay();
                });
                video.addEventListener('error', () => {
                    loadingOverlay.classList.remove('show');
                    errorOverlay.classList.add('show');
                    errorText.textContent = 'Failed to load the video. The file may be unavailable or in an unsupported format.';
                });
            }

            video.addEventListener('stalled', () => loadingOverlay.classList.add('show'));
            video.addEventListener('canplay', () => loadingOverlay.classList.remove('show'));
            video.addEventListener('waiting', () => loadingOverlay.classList.add('show'));
            video.addEventListener('playing', () => {
                loadingOverlay.classList.remove('show');
                document.getElementById('poster').classList.add('hide');
                bigPlay.classList.add('hide');
            });
        }

        let hlsInstance = null;
        let qualityLevels = [];

        function buildQualityList() {
            qualityLevels = (hlsInstance && hlsInstance.levels) || [];
        }

        function qualityLabel() {
            if (!hlsInstance || qualityLevels.length === 0) return 'Auto';
            if (hlsInstance.autoLevelEnabled || hlsInstance.currentLevel === -1) return 'Auto';
            const lvl = qualityLevels[hlsInstance.currentLevel];
            if (lvl && lvl.height) return lvl.height + 'p';
            return 'Auto';
        }

        // --- Settings menu (speed + quality) ---
        const speedOptions = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];

        let menuTimer = null;
        function renderMenu(section) {
            clearTimeout(menuTimer);
            menuSection = section;
            menuBack.classList.toggle('visible', section !== 'main');
            if (section === 'speed') {
                menuTitle.textContent = 'Playback Speed';
                menuItems.innerHTML = speedOptions.map(s => `
                    <button class="menu-item ${Math.abs(video.playbackRate - s) < 0.01 ? 'active' : ''}"
                            data-action="speed" data-val="${s}">${s}x</button>
                `).join('');
            } else if (section === 'quality') {
                menuTitle.textContent = 'Quality';
                const sorted = qualityLevels
                    .map((l, i) => ({ l, i }))
                    .sort((a, b) => (b.l.height || 0) - (a.l.height || 0) || a.i - b.i);
                let html = sorted.map(({ l, i }) => {
                    const active = !hlsInstance.autoLevelEnabled && hlsInstance.currentLevel === i;
                    const label = (l.height ? l.height + 'p' : 'Level ' + (i + 1));
                    return `<button class="menu-item ${active ? 'active' : ''}"
                        data-action="quality" data-val="${i}">${label}</button>`;
                }).join('');
                html += `<button class="menu-item ${qualityLabel() === 'Auto' ? 'active' : ''}"
                        data-action="quality" data-val="-1">Auto</button>`;
                menuItems.innerHTML = html;
            } else if (section === 'subs') {
                menuTitle.textContent = 'Subtitles';
                let html = `<button class="menu-item ${subtitleIndex < 0 ? 'active' : ''}"
                        data-action="subtitle" data-val="-1">Off</button>`;
                html += subsMeta.map((t, i) => `
                    <button class="menu-item ${subtitleIndex === i ? 'active' : ''}"
                        data-action="subtitle" data-val="${i}">${t.label || t.lang || 'Subtitle ' + (i + 1)}</button>
                `).join('');
                menuItems.innerHTML = html;
            } else if (section === 'substyle') {
                menuTitle.textContent = 'Subtitle Style';
                menuItems.innerHTML = `
                    <button class="menu-item" data-action="sub-size">
                        <span>Text Size</span>
                        <span class="menu-value">${sizeLabel()}</span>
                    </button>
                    <button class="menu-item" data-action="sub-color">
                        <span>Text Color</span>
                        <span class="menu-value"><i class="swatch" style="background:${subStyle.color}"></i>${colorLabel()}</span>
                    </button>
                    <button class="menu-item" data-action="sub-bg">
                        <span>Background</span>
                        <span class="menu-value">${bgLabel()}</span>
                    </button>
                    <button class="menu-item" data-action="sub-outline">
                        <span>Outline</span>
                        <span class="menu-value">${subStyle.outline ? 'On' : 'Off'}</span>
                    </button>
                    <button class="menu-item" data-action="sub-pos">
                        <span>Position</span>
                        <span class="menu-value">${subStyle.pos === 'top' ? 'Top' : 'Bottom'}</span>
                    </button>
                `;
            } else {
                menuTitle.textContent = 'Settings';
                menuItems.innerHTML = `
                    <button class="menu-item" data-action="open-speed">
                        <span>Playback Speed</span>
                        <span class="menu-value">${video.playbackRate}x</span>
                    </button>
                    <button class="menu-item" data-action="open-quality">
                        <span>Quality</span>
                        <span class="menu-value">${qualityLabel()}</span>
                    </button>
                    <button class="menu-item ${subsMeta.length ? '' : 'hide'}" data-action="open-subs">
                        <span>Subtitles</span>
                        <span class="menu-value">${currentSubtitleLabel()}</span>
                    </button>
                    <button class="menu-item" data-action="open-substyle">
                        <span>Subtitle Style</span>
                        <span class="menu-value">${subStyleSummary()}</span>
                    </button>
                `;
            }
        }

        function openMenu() {
            settingsOpen = true;
            settingsMenu.classList.add('open');
            showControls(true);
            renderMenu('main');
        }
        function closeMenu() {
            settingsOpen = false;
            settingsMenu.classList.remove('open');
            showControls(false);
        }

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (settingsMenu.classList.contains('open')) closeMenu();
            else openMenu();
        });
        menuBack.addEventListener('click', () => renderMenu('main'));
        menuItems.addEventListener('click', (e) => {
            const item = e.target.closest('.menu-item');
            if (!item) return;
            e.stopPropagation();
            const action = item.dataset.action;
            if (action === 'open-speed') renderMenu('speed');
            else if (action === 'open-quality') renderMenu('quality');
            else if (action === 'open-subs') renderMenu('subs');
            else if (action === 'open-substyle') renderMenu('substyle');
            else if (action === 'sub-size' || action === 'sub-color' || action === 'sub-bg' || action === 'sub-outline' || action === 'sub-pos') {
                cycleSub(action);
                applySubStyle();
                renderMenu('substyle');
                menuTimer = setTimeout(() => renderMenu('main'), 600);
            }
            else if (action === 'subtitle') {
                setSubtitle(parseInt(item.dataset.val, 10));
                renderMenu('subs');
                menuTimer = setTimeout(() => renderMenu('main'), 600);
            } else if (action === 'speed') {
                const s = parseFloat(item.dataset.val);
                video.playbackRate = s;
                renderMenu('speed');
                menuTimer = setTimeout(() => renderMenu('main'), 600);
            } else if (action === 'quality') {
                const idx = parseInt(item.dataset.val, 10);
                if (hlsInstance) hlsInstance.currentLevel = idx;
                renderMenu('quality');
                menuTimer = setTimeout(() => renderMenu('main'), 600);
            }
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#settings-menu, #settings-btn')) closeMenu();
        });

        // --- Skip Intro / Outro ---
        const skipIntroBtn = document.getElementById('skip-intro-btn');
        const skipOutroBtn = document.getElementById('skip-outro-btn');
        const qp = new URLSearchParams(location.search);
        const autoPlay = qp.get('autoplay') !== '0';
        let step = parseFloat(qp.get('step') || '10') || 10;
        const resumeTime = parseFloat(qp.get('t') || '0') || 0;
        let resumeDone = false;
        video.addEventListener('loadedmetadata', () => {
            if (resumeTime > 0 && !resumeDone) {
                resumeDone = true;
                video.currentTime = Math.min(resumeTime, Math.max(0, (video.duration || resumeTime) - 1));
            }
        });
        function tryPlay() {
            if (autoPlay) video.play().catch(() => {});
        }
        function parseRangeParam(name) {
            const v = qp.get(name);
            if (!v) return null;
            const m = v.match(/^([\d.]+)-([\d.]+)$/);
            if (!m) return null;
            return { start: parseFloat(m[1]), end: parseFloat(m[2]) };
        }
        let skipIntro = parseRangeParam('skipIntro');
        let skipOutro = parseRangeParam('skipOutro');
        let autoSkip = qp.get('autoSkip') === '1';
        let introAutoSkipped = false;
        let outroAutoSkipped = false;
        let skipBtnVisible = null;

        function updateSkipButtons() {
            const t = video.currentTime;
            let show = null;
            if (skipIntro && t >= skipIntro.start && t < skipIntro.end - 1) show = skipIntroBtn;
            else if (skipOutro && t >= skipOutro.start && t < skipOutro.end - 1) show = skipOutroBtn;
            if (show !== skipBtnVisible) {
                if (skipBtnVisible) skipBtnVisible.classList.remove('show');
                skipBtnVisible = show;
                if (skipBtnVisible) skipBtnVisible.classList.add('show');
            }
            if (autoSkip && skipIntro && !introAutoSkipped && t >= skipIntro.start && t < skipIntro.end) {
                introAutoSkipped = true;
                video.currentTime = skipIntro.end;
            }
            if (autoSkip && skipOutro && !outroAutoSkipped && t >= skipOutro.start && t < skipOutro.end) {
                outroAutoSkipped = true;
                video.currentTime = Math.min(skipOutro.end, (video.duration || skipOutro.end) - 1);
            }
        }

        skipIntroBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (skipIntro) { introAutoSkipped = true; video.currentTime = skipIntro.end; }
        });
        skipOutroBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (skipOutro) { outroAutoSkipped = true; video.currentTime = skipOutro.end; }
        });
        skipIntroBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
        skipOutroBtn.addEventListener('pointerdown', (e) => e.stopPropagation());

        // Parent -> player settings
        window.addEventListener('message', (e) => {
            const d = e.data || {};
            if (d.type === 'player-settings') {
                if (typeof d.autoSkip === 'boolean') {
                    autoSkip = d.autoSkip;
                    if (!autoSkip) { introAutoSkipped = false; outroAutoSkipped = false; }
                }
                if (d.skipIntro) skipIntro = d.skipIntro;
                if (d.skipOutro) skipOutro = d.skipOutro;
                if (typeof d.step === 'number' && d.step > 0) step = d.step;
                if (typeof d.autoplay === 'boolean') {
                    if (d.autoplay && video.paused) video.play().catch(() => {});
                }
            }
        });

        // Notify parent when the episode ends (auto-next)
        video.addEventListener('ended', () => {
            if (window.parent !== window) window.parent.postMessage({ type: 'video-ended' }, '*');
        });

        // Rewind / Forward
        rewindBtn.addEventListener('click', () => {
            video.currentTime = Math.max(0, video.currentTime - step);
        });
        forwardBtn.addEventListener('click', () => {
            video.currentTime = Math.min(video.duration || 0, video.currentTime + step);
        });

        // Previous / Next episode (asks the parent page to navigate)
        const hasPrev = qp.get('hasPrev') === '1';
        const hasNext = qp.get('hasNext') === '1';
        if (!hasPrev) prevEpBtn.classList.add('hide');
        if (!hasNext) nextEpBtn.classList.add('hide');
        prevEpBtn.addEventListener('click', () => {
            if (window.parent !== window) window.parent.postMessage({ type: 'player-nav', dir: -1 }, '*');
        });
        nextEpBtn.addEventListener('click', () => {
            if (window.parent !== window) window.parent.postMessage({ type: 'player-nav', dir: 1 }, '*');
        });

        // Play/Pause
        function setPlayingIcon(playing) {
            playBtn.innerHTML = playing
                ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
        }
        playBtn.addEventListener('click', () => {
            if (video.paused) video.play(); else video.pause();
        });
        video.addEventListener('play', () => {
            setPlayingIcon(true);
            bigPlay.classList.add('hide');
            showControls(false);
        });
        video.addEventListener('pause', () => {
            setPlayingIcon(false);
            bigPlay.classList.remove('hide');
            showControls(true);
        });

        // Volume
        volumeBar.addEventListener('input', () => {
            video.volume = volumeBar.value / 100;
            updateMuteIcon();
        });
        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            updateMuteIcon();
        });
        function updateMuteIcon() {
            if (video.muted || video.volume === 0) {
                muteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
            } else if (video.volume < 0.5) {
                muteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
            } else {
                muteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
            }
        }

        // --- Persist volume / mute / playback rate (miruro remembers these) ---
        const PLAYER_PREFS_KEY = 'ak_player_prefs';
        function loadPlayerPrefs() {
            try { return JSON.parse(localStorage.getItem(PLAYER_PREFS_KEY)) || {}; } catch (e) { return {}; }
        }
        function savePlayerPrefs(patch) {
            const prefs = { ...loadPlayerPrefs(), ...patch };
            localStorage.setItem(PLAYER_PREFS_KEY, JSON.stringify(prefs));
        }
        function restorePlayerPrefs() {
            const prefs = loadPlayerPrefs();
            if (typeof prefs.volume === 'number') {
                video.volume = Math.min(1, Math.max(0, prefs.volume));
                volumeBar.value = Math.round(video.volume * 100);
            }
            if (typeof prefs.muted === 'boolean') {
                video.muted = prefs.muted;
            }
            if (typeof prefs.rate === 'number' && speedOptions.includes(prefs.rate)) {
                video.playbackRate = prefs.rate;
            }
            updateMuteIcon();
        }
        video.addEventListener('volumechange', () => {
            updateMuteIcon();
            savePlayerPrefs({ volume: video.volume, muted: video.muted });
        });
        video.addEventListener('ratechange', () => {
            savePlayerPrefs({ rate: video.playbackRate });
        });
        // Setting a new source resets playbackRate to 1, so re-apply the saved
        // rate once the media actually loads.
        video.addEventListener('loadedmetadata', () => {
            const p = loadPlayerPrefs();
            if (typeof p.rate === 'number' && speedOptions.includes(p.rate)) video.playbackRate = p.rate;
        });

        // Time updates
        let lastProgressReport = 0;
        video.addEventListener('timeupdate', () => {
            renderSeek();
            updateSkipButtons();
            if (window.parent !== window) {
                const now = Date.now();
                if (now - lastProgressReport >= 5000 || video.paused) {
                    lastProgressReport = now;
                    window.parent.postMessage({
                        type: 'player-progress',
                        current: video.currentTime || 0,
                        duration: video.duration || 0,
                    }, '*');
                }
            }
        });

        // Fullscreen (switches to landscape orientation on mobile)
        const isMobileFs = () => window.matchMedia('(max-width: 768px)').matches;
        async function lockLandscape() {
            if (isMobileFs() && screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); } catch (e) { /* unsupported or already locked */ }
            }
        }
        async function unlockOrientation() {
            if (screen.orientation && screen.orientation.unlock) {
                try { screen.orientation.unlock(); } catch (e) {}
            }
        }
        fullscreenBtn.addEventListener('click', () => {
            const el = playerContainer;
            if (!document.fullscreenElement) {
                const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (req) {
                    Promise.resolve(req.call(el)).catch(() => {}).then(() => lockLandscape());
                }
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exit) Promise.resolve(exit.call(document)).catch(() => {});
                unlockOrientation();
            }
        });
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) unlockOrientation();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch (e.key) {
                case ' ':
                case 'k':
                    e.preventDefault();
                    video.paused ? video.play() : video.pause();
                    break;
                case 'f':
                    fullscreenBtn.click();
                    break;
                case 'ArrowLeft':
                case 'j':
                    video.currentTime = Math.max(0, video.currentTime - step);
                    break;
                case 'ArrowRight':
                case 'l':
                    video.currentTime = Math.min(video.duration || 0, video.currentTime + step);
                    break;
                case 'm':
                    video.muted = !video.muted;
                    updateMuteIcon();
                    break;
                case 'c':
                    ccBtn.click();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    video.volume = Math.min(1, video.volume + 0.1);
                    volumeBar.value = video.volume * 100;
                    updateMuteIcon();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    video.volume = Math.max(0, video.volume - 0.1);
                    volumeBar.value = video.volume * 100;
                    updateMuteIcon();
                    break;
            }
        });

        // --- Subtitle setup ---
        function setSubtitle(i) {
            subtitleIndex = i;
            const tracks = video.textTracks;
            for (let n = 0; n < tracks.length; n++) tracks[n].mode = (n === i) ? 'showing' : 'hidden';
            ccBtn.classList.toggle('on', i >= 0);
            ccBtn.title = i >= 0 ? `Subtitles: ${currentSubtitleLabel()} (click to toggle)` : 'Subtitles (click to enable)';
        }
        function initSubtitles() {
            if (!subsMeta.length) {
                ccBtn.style.display = 'none';
                return;
            }
            subsMeta.forEach((t) => {
                const tr = document.createElement('track');
                tr.kind = 'subtitles';
                tr.label = t.label || t.lang || 'Subtitle';
                tr.srclang = t.lang || 'en';
                tr.src = t.file;
                video.appendChild(tr);
            });
            const def = subsMeta.findIndex(t => t.default);
            setSubtitle(def >= 0 ? def : -1);
        }
        ccBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (subtitleIndex < 0) {
                const def = subsMeta.findIndex(t => t.default);
                setSubtitle(def >= 0 ? def : (subsMeta.length ? 0 : -1));
            } else {
                setSubtitle(-1);
            }
            showControls(false);
        });

        // --- Subtitle style customization ---
        const SUB_SIZE_OPTS = [['80%', 'Small'], ['100%', 'Medium'], ['130%', 'Large']];
        const SUB_COLOR_OPTS = [['#ffffff', 'White'], ['#ffe066', 'Yellow'], ['#7ff3ff', 'Cyan'], ['#ff9ecf', 'Pink'], ['#b7ffb0', 'Green']];
        const SUB_BG_OPTS = [['rgba(0,0,0,0)', 'None'], ['rgba(0,0,0,0.7)', 'Dark'], ['rgba(0,0,0,1)', 'Black'], ['rgba(255,255,255,0.85)', 'White']];
        const SUB_STYLE_DEFAULTS = { size: '100%', color: '#ffffff', bg: 'rgba(0,0,0,0.7)', outline: true, pos: 'bottom' };
        let subStyle = { ...SUB_STYLE_DEFAULTS };
        try { Object.assign(subStyle, JSON.parse(localStorage.getItem('ak_subStyle') || '{}')); } catch (e) {}

        function saveSubStyle() {
            try { localStorage.setItem('ak_subStyle', JSON.stringify(subStyle)); } catch (e) {}
        }
        function sizeLabel() { return (SUB_SIZE_OPTS.find(o => o[0] === subStyle.size) || SUB_SIZE_OPTS[1])[1]; }
        function colorLabel() { return (SUB_COLOR_OPTS.find(o => o[0] === subStyle.color) || SUB_COLOR_OPTS[0])[1]; }
        function bgLabel() { return (SUB_BG_OPTS.find(o => o[0] === subStyle.bg) || SUB_BG_OPTS[1])[1]; }
        function cycleSub(action) {
            if (action === 'sub-size') {
                const i = SUB_SIZE_OPTS.findIndex(o => o[0] === subStyle.size);
                subStyle.size = SUB_SIZE_OPTS[(i + 1) % SUB_SIZE_OPTS.length][0];
            } else if (action === 'sub-color') {
                const i = SUB_COLOR_OPTS.findIndex(o => o[0] === subStyle.color);
                subStyle.color = SUB_COLOR_OPTS[(i + 1) % SUB_COLOR_OPTS.length][0];
            } else if (action === 'sub-bg') {
                const i = SUB_BG_OPTS.findIndex(o => o[0] === subStyle.bg);
                subStyle.bg = SUB_BG_OPTS[(i + 1) % SUB_BG_OPTS.length][0];
            } else if (action === 'sub-outline') {
                subStyle.outline = !subStyle.outline;
            } else if (action === 'sub-pos') {
                subStyle.pos = subStyle.pos === 'top' ? 'bottom' : 'top';
            }
            saveSubStyle();
        }

        let cueStyleEl = null;
        function subCuePx() {
            const scale = { '80%': 0.8, '100%': 1, '130%': 1.35 }[subStyle.size] || 1;
            return Math.max(13, Math.round((video.videoHeight || 720) * 0.05 * scale));
        }
        function applySubStyle() {
            if (!cueStyleEl) {
                cueStyleEl = document.createElement('style');
                cueStyleEl.id = 'cue-style';
                document.head.appendChild(cueStyleEl);
            }
            const shadow = subStyle.outline
                ? '0 0 2px #000, 0 0 2px #000, 1px 1px 2px #000, -1px -1px 2px #000'
                : 'none';
            const pos = subStyle.pos === 'top'
                ? 'top: 8%; bottom: auto;'
                : 'bottom: 8%; top: auto;';
            cueStyleEl.textContent = `
                #hls-video::cue {
                    font-size: ${subCuePx()}px !important;
                    color: ${subStyle.color} !important;
                    background-color: ${subStyle.bg} !important;
                    text-shadow: ${shadow} !important;
                    ${pos}
                }`;
        }
        function subStyleSummary() {
            return sizeLabel() + ' · ' + colorLabel();
        }
        video.addEventListener('loadedmetadata', applySubStyle);
        window.addEventListener('resize', applySubStyle);

        // --- Initialize ---
        initSubtitles();
        restorePlayerPrefs();
        loadVideo(videoUrl);
    </script>
</body>
</html>
